// ─── AGP 8.5.2 — stable, compatible with Capacitor 8.x ─────────────────────
// AGP 9.x was attempted in v1.9.0 but caused the release APK to crash on
// launch due to Capacitor 8.x incompatibility. Reverting to 8.5.2.
// ─────────────────────────────────────────────────────────────────────────────

buildscript {
    apply from: "variables.gradle"
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

defaultTasks ':app:assembleRelease'
