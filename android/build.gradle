// ─── AGP 9.1.0 — full R8 full-mode, proguard-android-optimize.txt only ─────
// AGP 9 removes support for proguard-android.txt; the app and all Capacitor
// library Gradle files use proguard-android-optimize.txt (patched by
// scripts/patch-capacitor-agp9.js during postinstall).
// ─────────────────────────────────────────────────────────────────────────────

buildscript {
    apply from: "variables.gradle"
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

defaultTasks ':app:assembleRelease'
