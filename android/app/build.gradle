apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.fruitcatcher.game"
    compileSdk 36

    defaultConfig {
        applicationId "com.fruitcatcher.game"
        minSdk 24
        targetSdk 36
        versionCode 55
        versionName "1.8.6"
    }

    // Ship only the languages the app actually has resources for.
    androidResources {
        localeFilters += ["en"]
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                // Local build: read from keystore.properties
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 in full mode (see gradle.properties) — shrink, optimize, obfuscate.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Without keystore.properties (local or CI builds that skip the
            // keystore step) an unsigned release APK is produced, which Android
            // refuses to install/launch. Fall back to the debug key so the
            // resulting APK is always installable and runnable.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // Per-device downloads instead of one universal APK inside the AAB.
    bundle {
        // Language split disabled: only "en" resources are shipped, and a
        // missing language split makes converted/sideloaded APKs crash on
        // launch with "missing split config".
        language { enableSplit = false }
        density  { enableSplit = true }
        abi      { enableSplit = true }
    }

    packaging {
        resources {
            // Do NOT exclude 'kotlin/**' or '*.kotlin_module': Unity Ads 4.x is
            // Kotlin and needs its metadata at runtime.
            excludes += [
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'DebugProbesKt.bin'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':ad-id-compat')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: "capacitor.build.gradle"

// -- Web assets safety net ---------------------------------------------------
// Capacitor copies public/ into app/src/main/assets/public during `cap sync`.
// If a build runs without that step (Android Studio, or a gradle-only CI job),
// the WebView has no index.html to load and the app dies on launch with a blank
// screen / immediate crash. When cap sync has NOT produced the assets, mirror
// public/ into a generated assets dir so the APK/AAB always contains the game.
// When cap sync HAS run, this stays inactive to avoid duplicate-asset merges.
def webSourceDir = rootProject.file("../public")
def syncedAssets = file("src/main/assets/public/index.html")

if (webSourceDir.exists() && !syncedAssets.exists()) {
    def generatedAssetsDir = layout.buildDirectory.dir("generatedWebAssets")

    def syncWebAssets = tasks.register("syncWebAssets", Copy) {
        from webSourceDir
        into generatedAssetsDir.map { it.dir("public") }
    }

    android {
        sourceSets {
            main {
                assets.srcDirs += [generatedAssetsDir.get().asFile]
            }
        }
    }

    tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach {
        dependsOn syncWebAssets
    }
}

// AD_ID: the app manifest declares the permission directly and :ad-id-compat
// supplies the lower-priority declaration for the merger. No manifest patching
// hooks are needed — they only slowed the build and broke task up-to-date checks.
