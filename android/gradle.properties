# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# Jetifier is not needed: every dependency is already AndroidX.
android.enableJetifier=false
android.nonTransitiveRClass=true

# R8 full mode disabled — Capacitor 8.x loads plugins reflectively at runtime.
# R8 full mode in AGP 9 aggressively removes classes it considers unused,
# which strips Capacitor's Plugin/PluginRegistration classes and causes the
# app to crash on launch. Standard R8 mode preserves the consumer ProGuard
# rules that Capacitor and Unity Ads ship in their AARs.
android.enableR8.fullMode=false
# Non-final resource IDs disabled for AGP 9 compatibility with Capacitor.
android.nonFinalResIds=false
