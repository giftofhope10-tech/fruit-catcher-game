# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# Jetifier is not needed: every dependency is already AndroidX.
android.enableJetifier=false
android.nonTransitiveRClass=true

# R8 full mode: maximum shrinking, obfuscation and optimization.
android.enableR8.fullMode=true
# R8-integrated ("optimized") resource shrinking - removes unused resources
# more aggressively and rewrites the resource table. Requires AGP 8.9+.
android.r8.optimizedResourceShrinking=true
# Non-final resource IDs let R8 inline and shrink resource lookups.
android.nonFinalResIds=true
# Store native libraries uncompressed so the OS maps them directly (smaller
# install footprint and faster startup on API 23+).
android.bundle.enableUncompressedNativeLibs=true
