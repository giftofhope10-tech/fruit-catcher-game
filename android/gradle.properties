# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# Jetifier is not needed: every dependency is already AndroidX.
android.enableJetifier=false
android.nonTransitiveRClass=true

# R8 full mode is the only mode in AGP 9; the legacy
# android.enableR8.fullMode flag is deprecated and ignored.
# Minification is enabled in app/build.gradle with targeted ProGuard keep
# rules for Capacitor's reflectively-loaded plugins and Unity Ads.
# Non-final resource IDs (AGP 9 default) are required for R8's optimized
# resource shrinking, which shrinkResources uses below.
android.nonFinalResIds=true
